name: Publish to Maven

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  building:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v3

      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: vlc
          version: 3.0.18

      - name: Update APT index
        run: sudo apt update && sudo apt upgrade -y
        shell: bash

      - name: Install VLC
        run: sudo apt install vlc
        shell: bash

      - name: Set up JDK (21)
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build CI
        run: ./gradlew build

  publishing:
    needs: ['building']
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout Tag
        uses: actions/checkout@v3

      - name: Set up JDK (21)
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Release to Github packages
        run: ./gradlew publish --parallel
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}